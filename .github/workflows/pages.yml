
name: 部署去明日预览网站

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4

      - name: 自动识别 ZIP 或分包并解压
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import zipfile
          import shutil

          root = Path(".")
          zip_files = sorted(
              p for p in root.iterdir()
              if p.is_file() and p.suffix.lower() == ".zip"
          )

          part_files = [
              p for p in root.iterdir()
              if p.is_file()
              and re.fullmatch(r".+\.part-\d+", p.name)
          ]

          if zip_files:
              if len(zip_files) != 1:
                  raise SystemExit(
                      "错误：发现多个 ZIP，请只保留最新的网站 ZIP"
                  )

              source_zip = zip_files[0]
              print("使用完整 ZIP:", source_zip.name)

          elif part_files:
              groups = {}

              for p in part_files:
                  prefix, number = p.name.rsplit(".part-", 1)
                  groups.setdefault(prefix, []).append(
                      (int(number), p)
                  )

              if len(groups) != 1:
                  raise SystemExit(
                      "错误：发现多组分包，请只保留一组"
                  )

              parts = next(iter(groups.values()))
              parts.sort()

              numbers = [n for n, _ in parts]

              if numbers != list(range(1, len(parts) + 1)):
                  raise SystemExit("错误：分包编号不连续")

              source_zip = Path("assembled-site.zip")

              with source_zip.open("wb") as output:
                  for number, part in parts:
                      print("合并:", part.name)

                      with part.open("rb") as source:
                          shutil.copyfileobj(source, output)

          else:
              raise SystemExit(
                  "错误：没有找到 ZIP 或 preview.part-01 等分包"
              )

          with zipfile.ZipFile(source_zip) as z:
              bad_file = z.testzip()

              if bad_file is not None:
                  raise SystemExit(
                      f"错误：ZIP 文件损坏：{bad_file}"
                  )

              names = z.namelist()

              if "index.html" not in names:
                  raise SystemExit(
                      "错误：ZIP 根目录缺少 index.html，"
                      "请上传构建成品 ZIP，而不是源代码 ZIP"
                  )

              site = Path("site")
              site.mkdir(exist_ok=True)

              z.extractall(site)

          Path("site/.nojekyll").touch()

          print("网站文件准备完成")

          PY

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署预览网站
        id: deployment
        uses: actions/deploy-pages@v4
