
name: 部署去明日预览网站

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4

      - name: 解压网站
        run: |
          mkdir -p site
          unzip -o "外框和白框修复试运行.zip" -d site
          test -f site/index.html

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 发布预览网站
        id: deployment
        uses: actions/deploy-pages@v4
